name: Build LGPL FFmpeg Media3 audio decoder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish (e.g. 0.1.3). Leave empty for a build-only run that publishes nothing."
        required: false
        default: ""

env:
  MEDIA3_REF: "5fb306449733dd71595700c1227ad6087578c559"
  FFMPEG_REF: "3f92512fd1fd6f5e6d6eb45a156c352835314d69"
  ENABLED_DECODERS: "ac3 eac3 dca mlp truehd"
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # One run does the whole release. A manual run WITH a version behaves exactly like pushing
      # the tag "v<version>": the tag is created at this commit in the publish step below and the
      # immutable release is published in the same run. A manual run without a version is a
      # build-only check and publishes nothing, as before. A tag push behaves as it always has.
      - name: Resolve release tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"; release=1
          elif [[ -n "${{ inputs.version }}" ]]; then
            tag="v${{ inputs.version }}"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "version must look like 0.1.3"; exit 1; }
            release=1
          else
            tag="${GITHUB_REF_NAME}"; release=0
          fi
          echo "REL_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "RELEASE=${release}" >> "${GITHUB_ENV}"
          echo "tag=${tag} release=${release}"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK and native build dependencies
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          sudo apt-get update
          sudo apt-get install -y make nasm pkg-config yasm

      - name: Check out exact Media3 source
        run: |
          git init media
          git -C media remote add origin https://github.com/androidx/media.git
          git -C media fetch --depth 1 origin "${MEDIA3_REF}"
          git -C media checkout --detach FETCH_HEAD
          test "$(git -C media rev-parse HEAD)" = "${MEDIA3_REF}"

      - name: Override Media3 NDK version
        run: |
          find media -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i "s/ndkVersion[[:space:]]*=[[:space:]]*[\"'][^\"']*[\"']/ndkVersion = \"${NDK_VERSION}\"/g" {} \;
          find media -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i "s/ndkVersion[[:space:]]*[\"'][^\"']*[\"']/ndkVersion \"${NDK_VERSION}\"/g" {} \;

      - name: Check out exact FFmpeg source
        working-directory: media/libraries/decoder_ffmpeg/src/main/jni
        run: |
          git init ffmpeg
          git -C ffmpeg remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C ffmpeg fetch --depth 1 origin "${FFMPEG_REF}"
          git -C ffmpeg checkout --detach FETCH_HEAD
          test "$(git -C ffmpeg rev-parse HEAD)" = "${FFMPEG_REF}"

      - name: Build five-decoder LGPL extension
        working-directory: media/libraries/decoder_ffmpeg/src/main/jni
        run: |
          NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          FFMPEG_MODULE_PATH="$(pwd)/.."
          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" "${NDK_HOME}" "linux-x86_64" \
            "26" ${ENABLED_DECODERS}

      - name: Assemble AAR
        working-directory: media
        run: ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon

      - name: Verify and package release evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_AAR=$(find media -path "*decoder_ffmpeg*" -name "*-release.aar" -type f | head -1)
          test -n "${SOURCE_AAR}"
          mkdir -p dist inspect
          cp "${SOURCE_AAR}" "dist/flowvid-media3-ffmpeg-${REL_TAG}.aar"
          unzip -q "${SOURCE_AAR}" -d inspect
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "inspect/jni/${abi}/libffmpegJNI.so"
          done
          if find inspect -type f -name 'libav*.so' | grep -q .; then
            echo "Unexpected shared FFmpeg libraries found"
            exit 1
          fi
          cat > dist/build-manifest.txt <<EOF
          recipe_commit=${GITHUB_SHA}
          media3_commit=${MEDIA3_REF}
          ffmpeg_commit=${FFMPEG_REF}
          ndk_version=${NDK_VERSION}
          min_sdk=26
          decoders=${ENABLED_DECODERS}
          license_mode=LGPL_no_enable_gpl
          abis=arm64-v8a,armeabi-v7a,x86,x86_64
          EOF
          (cd dist && sha256sum *.aar build-manifest.txt > SHA256SUMS.txt)
          cat dist/build-manifest.txt
          cat dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flowvid-media3-ffmpeg-${{ env.REL_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release evidence
        if: env.RELEASE == '1'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.aar
            dist/SHA256SUMS.txt

      - name: Publish immutable GitHub Release
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${REL_TAG}"
          # A manual run with a version has no tag yet: create it at this commit, so the release,
          # the attestation and "git checkout v..." all agree. A failed build never gets a tag,
          # because this only runs after the build and verification steps succeeded.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          state=$(gh release view "${tag}" --json isDraft,isImmutable,targetCommitish 2>/dev/null || true)

          if [ -z "${state}" ]; then
            gh release create "${tag}" --draft --target "${GITHUB_SHA}" \
              --title "FlowVid Media3 FFmpeg ${tag}" \
              --notes "Pinned four-ABI five-decoder LGPL build with manifest, checksums and provenance."
          elif [ "$(jq -r '.isImmutable' <<<"${state}")" = "true" ]; then
            for file in dist/*; do
              name=$(basename "${file}")
              local_digest="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              remote_digest=$(gh release view "${tag}" --json assets \
                --jq ".assets[] | select(.name == \"${name}\") | .digest")
              test "${remote_digest}" = "${local_digest}"
            done
            echo "Immutable release ${tag} already matches this build."
            exit 0
          else
            test "$(jq -r '.isDraft' <<<"${state}")" = "true"
            test "$(jq -r '.targetCommitish' <<<"${state}")" = "${GITHUB_SHA}"
          fi

          gh release upload "${tag}" dist/* --clobber
          gh release edit "${tag}" --draft=false

          test "$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" = "true"
          for file in dist/*; do
            name=$(basename "${file}")
            local_digest="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
            remote_digest=$(gh release view "${tag}" --json assets \
              --jq ".assets[] | select(.name == \"${name}\") | .digest")
            test "${remote_digest}" = "${local_digest}"
          done
